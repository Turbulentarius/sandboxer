volumes:
  node_modules:
  mariadb:
    driver: local

networks:
    sandboxer:
        driver: bridge

services:
  node:
    image: node:24.21.0-alpine3.24
    profiles: [frontend]
    init: true
    working_dir: /app
    command: [npm, run, dev, --, --host, 0.0.0.0, --port, "5173", --strictPort]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - type: bind
        source: ./www/${APP_PATH:-laravel}
        target: /app
        bind:
          create_host_path: false
      - node_modules:/app/node_modules
    networks:
      - sandboxer
  setup: # A one-time-run setup service for when starting containers. Also, this is the service name which should only be unique to this docker-compose project
    command: /bin/sh /setup.sh
    build:
      context: ./
      dockerfile: setup.dockerfile
    image: sandboxer-setup
    volumes:
      - ./www:/srv/sandboxer
    restart: no
  db:
    image: mariadb:11.4.13
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      MYSQL_ROOT_PASSWORD: superduperroot
      MYSQL_DATABASE: sandbox
      MYSQL_USER:  sandboxer
      MYSQL_PASSWORD: localuserpassword
    ports:
        - "127.0.0.1:3306:3306"
    volumes:
     - ./dbdata:/var/lib/mysql
     - ./iedata:/srv/iedata
    networks:
      sandboxer:
  php:
    build:
      context: ./
      dockerfile: ./php8.5-fpm.dockerfile
    image: sandboxer-php # Name of the image to build
    expose:
      - "9000" # Expose a port on the virtual network (sandboxer), but do not expose it on the HOST
    networks:
      - sandboxer
    volumes:
      - ./www:/srv/sandboxer # Mount a "www" directory on the host that is shared with the web server. E.g. Apache or Nginx
      - ./log/php:/var/log/php85 # Mount the log file directory to a place on host so we can access the log files
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: sandbox
      MYSQL_USER: sandboxer
      MYSQL_PASSWORD: localuserpassword
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/php-fpm-healthcheck"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 6
  apache2:
    ports:
      - "127.0.0.1:80:80" # Publish only on the host's IPv4 loopback interface.
      - "127.0.0.1:443:443"
      - "127.0.0.1:8000:8000"
    networks:
      - sandboxer
    build:
      context: ./
      dockerfile: apache2.dockerfile
    image: sandboxer-apache2
    volumes:
      - ./www:/srv/sandboxer
      - ./log/apache2:/var/log/apache2
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      php:
        condition: service_healthy
