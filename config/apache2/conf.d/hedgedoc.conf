<VirtualHost *:80>
    ServerName hedgedoc.localhost

    Alias /uploads/ /srv/hedgedoc/public/uploads/

    <Directory "/srv/hedgedoc/public/uploads">
        Options -Indexes
        Require all granted
    </Directory>

    ProxyPreserveHost On

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://hedgedoc:3000/$1 [P,L]

    ProxyPass /uploads/ !
    ProxyPass / http://hedgedoc:3000/
    ProxyPassReverse / http://hedgedoc:3000/
</VirtualHost>